# Exercice 4 — La page HTML de votre site, stockée dans le cluster.
# Une ConfigMap contient de la configuration (ou de petits fichiers) séparée de l'image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: site-html
data:
  index.html: |
    <!doctype html>
    <html lang="fr">
      <head>
        <meta charset="utf-8">
        <title>Mon site Kubernetes</title>
      </head>
      <body>
        <h1>Bienvenue sur mon site Kubernetes</h1>
        <p>William LY I3 RS2</p>
        <p>Déployé avec Nginx et une ConfigMap.</p>
      </body>
    </html>
